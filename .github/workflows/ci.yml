name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Formatting & Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install external check tools (cargo-audit, taplo)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,taplo-cli

      - name: Install Prettier
        run: npm install -g prettier

      - name: Check code formatting (Rust)
        run: cargo fmt --check

      - name: Check Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install Purist
        run: cargo install purist --locked

      - name: Run Purist AST linter
        run: purist

      - name: Check API manifest drift
        run: cargo run -- check

      - name: Check TOML formatting (Taplo)
        run: taplo fmt --check

      - name: Check Markdown and JSON formatting (Prettier)
        run: prettier --check "**/*.{md,json}"

      - name: Run cargo security audit
        run: cargo audit

      - name: Verify package & metadata
        run: |
          cargo metadata --format-version 1 --no-deps > /dev/null
          cargo publish --dry-run --workspace

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test --all-targets --all-features

  msrv:
    name: Minimum Supported Rust Version (MSRV)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify MSRV consistency across manifest and badges
        id: msrv
        run: |
          MSRV=$(sed -nE 's/^[[:space:]]*rust-version[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+(\.[0-9]+)?)"/\1/p' Cargo.toml | head -n 1)
          if [ -z "$MSRV" ]; then
            echo "Error: rust-version not found in Cargo.toml"
            exit 1
          fi
          echo "Found rust-version: $MSRV"
          MSRV_PREFIX=$(echo "$MSRV" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')

          # Verify README badge
          if ! grep -q "https://img.shields.io/badge/MSRV-${MSRV_PREFIX}%2B-" README.md; then
            echo "Error: README.md MSRV badge does not match Cargo.toml rust-version ($MSRV_PREFIX+)"
            exit 1
          fi

          echo "MSRV consistency check passed: $MSRV (badge: ${MSRV_PREFIX}+)"
          echo "msrv=$MSRV" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check compilation with MSRV
        run: cargo check --all-targets --all-features

  nix:
    name: Nix Flake Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Cache Nix builds
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Check Nix flake
        run: nix flake check

      - name: Build Nix package
        run: nix build

  auto-merge:
    name: Dependabot Auto-Merge
    needs: [lint, test, msrv, nix]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: dependabot-auto-merge
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge patch and minor updates (excluding Nix flakes)
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          if [ "$PACKAGE_ECOSYSTEM" = "nix" ]; then
            echo "Skipping auto-merge for Nix flake updates."
            exit 0
          fi

          if gh pr view "$PR_URL" --json files --jq '.files[].path' | grep -qxE 'flake\.(lock|nix)'; then
            echo "Skipping auto-merge for PR modifying Nix flake files."
            exit 0
          fi

          if [ "$UPDATE_TYPE" != "version-update:semver-patch" ] && [ "$UPDATE_TYPE" != "version-update:semver-minor" ]; then
            echo "Skipping auto-merge for update type: $UPDATE_TYPE"
            exit 0
          fi

          if gh pr merge --auto --merge "$PR_URL"; then
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            PR_INFO=$(gh pr view "$PR_URL" --json state,mergeStateStatus)
            PR_STATE=$(echo "$PR_INFO" | jq -r '.state')
            MERGE_STATE=$(echo "$PR_INFO" | jq -r '.mergeStateStatus')

            if [ "$PR_STATE" = "MERGED" ]; then
              echo "Pull request is already merged."
              exit 0
            fi

            if [ "$MERGE_STATE" = "UNKNOWN" ]; then
              if [ "$attempt" -lt 5 ]; then
                sleep 5
                continue
              fi
            fi

            if [ "$MERGE_STATE" = "BEHIND" ]; then
              echo "::notice::Skipping immediate merge because the PR branch is behind the base branch (e.g. another PR merged while CI was running). Rebase/update the branch (e.g. '@dependabot rebase') or enable repository auto-merge."
              exit 0
            fi

            if [ "$MERGE_STATE" = "DIRTY" ]; then
              echo "::notice::Skipping immediate merge because the PR has merge conflicts. Dependabot will rebase automatically."
              exit 0
            fi

            if gh pr merge --merge "$PR_URL"; then
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep 5
            fi
          done

          MERGE_STATE=$(gh pr view "$PR_URL" --json mergeStateStatus --jq '.mergeStateStatus')
          if [ "$MERGE_STATE" = "BEHIND" ] || [ "$MERGE_STATE" = "DIRTY" ]; then
            echo "::notice::PR became $MERGE_STATE while attempting merge; waiting for rebase/update."
            exit 0
          fi
          exit 1

