name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Formatting & Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install external check tools (cargo-audit, taplo)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,taplo-cli

      - name: Install Prettier
        run: npm install -g prettier

      - name: Check code formatting (Rust)
        run: cargo fmt --check

      - name: Check Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install Purist
        run: cargo install purist --locked

      - name: Run Purist AST linter
        run: purist

      - name: Check API manifest drift
        run: cargo run -- check

      - name: Check TOML formatting (Taplo)
        run: taplo fmt --check

      - name: Check Markdown and JSON formatting (Prettier)
        run: prettier --check "**/*.{md,json}"

      - name: Run cargo security audit
        run: cargo audit

      - name: Verify package & metadata
        run: |
          cargo metadata --format-version 1 --no-deps > /dev/null
          cargo publish --dry-run --workspace

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test --all-targets --all-features

  msrv:
    name: Minimum Supported Rust Version (MSRV)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify MSRV consistency across manifest and badges
        id: msrv
        run: |
          MSRV=$(sed -nE 's/^[[:space:]]*rust-version[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+(\.[0-9]+)?)"/\1/p' Cargo.toml | head -n 1)
          if [ -z "$MSRV" ]; then
            echo "Error: rust-version not found in Cargo.toml"
            exit 1
          fi
          echo "Found rust-version: $MSRV"
          MSRV_PREFIX=$(echo "$MSRV" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')

          # Verify README badge
          if ! grep -q "https://img.shields.io/badge/MSRV-${MSRV_PREFIX}%2B-" README.md; then
            echo "Error: README.md MSRV badge does not match Cargo.toml rust-version ($MSRV_PREFIX+)"
            exit 1
          fi

          echo "MSRV consistency check passed: $MSRV (badge: ${MSRV_PREFIX}+)"
          echo "msrv=$MSRV" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check compilation with MSRV
        run: cargo check --all-targets --all-features

  nix:
    name: Nix Flake Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Cache Nix builds
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Check Nix flake
        run: nix flake check

      - name: Build Nix package
        run: nix build

  auto-merge:
    name: Dependabot Auto-Merge
    needs: [lint, test, msrv, nix]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge patch and minor updates
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          UPDATED_DEPS_JSON: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          SHOULD_MERGE=false
          if [ "$UPDATE_TYPE" = "version-update:semver-patch" ] || [ "$UPDATE_TYPE" = "version-update:semver-minor" ]; then
            SHOULD_MERGE=true
          elif echo "$UPDATED_DEPS_JSON" | jq -e '
            map(select((.newVersion // "") | test("^[0-9a-f]{40}$") | not))
            | length > 0 and all(.updateType == "version-update:semver-patch" or .updateType == "version-update:semver-minor")
          ' > /dev/null; then
            SHOULD_MERGE=true
          fi

          if [ "$SHOULD_MERGE" = "true" ]; then
            if ! gh pr merge --auto --merge "$PR_URL"; then
              for attempt in 1 2 3; do
                if gh pr merge --merge "$PR_URL"; then
                  break
                fi
                if [ "$attempt" -lt 3 ]; then
                  sleep 5
                else
                  exit 1
                fi
              done
            fi
          else
            echo "Skipping auto-merge for update type: $UPDATE_TYPE"
          fi

